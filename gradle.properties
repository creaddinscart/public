org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=true
org.gradle.java.home=/Users/cubexxbro/.qwenwork/workspace/mwr8b5j81zki3a3e/.tools/jdk-25.0.5.1+2/Contents/Home
# maven.fabricmc.net / repo.maven.apache.org intermittently drop TLS handshakes here.
# Force TLSv1.2 + IPv4, serialize downloads, and retry aggressively with backoff.
systemProp.https.protocols=TLSv1.2
systemProp.java.net.preferIPv4Stack=true
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.tentatives=15
systemProp.org.gradle.internal.repository.initial.backoff=800

